<div class="auth-page">

  <div class="auth-card">

    <h1>TaskFlow</h1>

    <h2>Login</h2>

    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>

      @if (errorMessage) {

        <p class="error">
          {{ errorMessage }}
        </p>

      }

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="bottom-text">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </p>

  </div>

</div>

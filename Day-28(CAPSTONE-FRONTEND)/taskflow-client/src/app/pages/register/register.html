<div class="auth-page">

  <div class="auth-card">

    <h1>TaskFlow</h1>

    <h2>Create Account</h2>

    <form
      (ngSubmit)="register()"
    >

      <div class="form-group">

        <label>
          Name
        </label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required
        />

      </div>

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>

      @if (errorMessage) {

        <p class="error">
          {{ errorMessage }}
        </p>

      }

      @if (successMessage) {

        <p class="success">
          {{ successMessage }}
        </p>

      }

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>

    </form>

    <p class="bottom-text">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>

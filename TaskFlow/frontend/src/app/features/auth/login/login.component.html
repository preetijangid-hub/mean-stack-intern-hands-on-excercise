<div class="auth-page">
  <div class="auth-card tf-card">
    <h1 class="brand-title">TaskFlow</h1>
    <p class="tagline">Plan better. Work smarter.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <div class="tf-field-error" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Enter a valid email.</span>
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Your password" />
        <div class="tf-field-error" *ngIf="password?.invalid && password?.touched">
          Password is required.
        </div>
      </div>

      <button class="tf-btn tf-btn-primary submit-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="switch-auth">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>

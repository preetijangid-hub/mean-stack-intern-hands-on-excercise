<div class="auth-page">
  <div class="auth-card tf-card">
    <h1 class="brand-title">TaskFlow</h1>
    <p class="tagline">Create your account</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="name">Full name</label>
        <input id="name" type="text" formControlName="name" placeholder="Jane Doe" />
        <div class="tf-field-error" *ngIf="name?.invalid && name?.touched">Name is required.</div>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <div class="tf-field-error" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Enter a valid email.</span>
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="At least 6 characters" />
        <div class="tf-field-error" *ngIf="password?.invalid && password?.touched">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Repeat your password" />
        <div class="tf-field-error" *ngIf="form.errors?.['passwordsMismatch'] && confirmPassword?.touched">
          Passwords do not match.
        </div>
      </div>

      <button class="tf-btn tf-btn-primary submit-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="switch-auth">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>

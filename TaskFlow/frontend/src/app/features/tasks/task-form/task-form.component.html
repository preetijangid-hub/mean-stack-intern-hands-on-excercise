<div class="tf-container narrow">
  <div class="tf-page-header">
    <h1>{{ isEditMode ? 'Edit Task' : 'Create Task' }}</h1>
  </div>

  <div *ngIf="pageLoading()" class="tf-spinner-wrap">
    <div class="spinner"></div>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="tf-card form-card" *ngIf="!pageLoading()">
    <div class="form-field">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="e.g. Finish project report" />
      <div class="tf-field-error" *ngIf="title?.invalid && title?.touched">Title is required.</div>
    </div>

    <div class="form-field">
      <label for="description">Description</label>
      <textarea id="description" rows="4" formControlName="description" placeholder="Add more details (optional)"></textarea>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label for="priority">Priority</label>
        <select id="priority" formControlName="priority">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div class="form-field">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>

    <div class="form-field">
      <label for="dueDate">Due date</label>
      <input id="dueDate" type="date" formControlName="dueDate" />
    </div>

    <div class="form-actions">
      <a routerLink="/tasks" class="tf-btn tf-btn-outline">Cancel</a>
      <button class="tf-btn tf-btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Save Changes' : 'Create Task') }}
      </button>
    </div>
  </form>
</div>

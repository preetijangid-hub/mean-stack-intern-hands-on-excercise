<div class="tf-container">
  <div class="tf-page-header">
    <div>
      <h1>Tasks</h1>
      <p class="subtitle">{{ tasks().length }} task(s) found</p>
    </div>
    <a routerLink="/tasks/new" class="tf-btn tf-btn-primary">+ New Task</a>
  </div>

  <div class="filters tf-card">
    <input
      type="text"
      placeholder="Search by title..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      class="search-input"
    />

    <select [(ngModel)]="statusFilter" (ngModelChange)="loadTasks()">
      <option value="">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>

    <select [(ngModel)]="priorityFilter" (ngModelChange)="loadTasks()">
      <option value="">All priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>

    <button class="tf-btn tf-btn-outline" (click)="clearFilters()">Clear Filters</button>
  </div>

  <div *ngIf="loading()" class="tf-spinner-wrap">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!loading() && error()" class="tf-empty-state">{{ error() }}</div>

  <div *ngIf="!loading() && !error() && tasks().length === 0" class="tf-empty-state tf-card">
    <h3>No tasks yet</h3>
    <p>Create your first task to get started.</p>
    <a routerLink="/tasks/new" class="tf-btn tf-btn-primary">+ New Task</a>
  </div>

  <div class="task-grid" *ngIf="!loading() && !error() && tasks().length > 0">
    <div class="task-card tf-card" *ngFor="let task of tasks()">
      <div class="task-card-top">
        <h3>{{ task.title }}</h3>
        <app-badge [text]="task.priority"></app-badge>
      </div>
      <p class="task-desc">{{ task.description || 'No description provided.' }}</p>
      <div class="task-meta">
        <app-badge [text]="task.status"></app-badge>
        <span class="due-date" *ngIf="task.dueDate">Due {{ task.dueDate | date: 'MMM d, y' }}</span>
      </div>
      <div class="task-actions">
        <a [routerLink]="['/tasks', task._id]" class="tf-btn tf-btn-outline">Details</a>
        <a [routerLink]="['/tasks', task._id, 'edit']" class="tf-btn tf-btn-outline">Edit</a>
        <button class="tf-btn tf-btn-danger" (click)="confirmDelete(task)">Delete</button>
      </div>
    </div>
  </div>
</div>

<mat-card>

  <mat-card-header>
    <mat-card-title>Task Management</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <div class="add-task">

      <mat-form-field appearance="outline">

        <mat-label>Task title</mat-label>

        <input
          matInput
          [(ngModel)]="newTask"
          placeholder="Enter task title"
        />

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="addTask()"
      >
        Add Task
      </button>

    </div>

    <table
      mat-table
      [dataSource]="tasks"
      class="task-table"
    >

      <ng-container matColumnDef="id">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          ID
        </th>

        <td
          mat-cell
          *matCellDef="let task"
        >
          {{ task.id }}
        </td>

      </ng-container>


      <ng-container matColumnDef="title">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Task
        </th>

        <td
          mat-cell
          *matCellDef="let task"
        >
          {{ task.title }}
        </td>

      </ng-container>


      <ng-container matColumnDef="status">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Status
        </th>

        <td
          mat-cell
          *matCellDef="let task"
        >
          {{ task.completed ? 'Completed' : 'Pending' }}
        </td>

      </ng-container>


      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Actions
        </th>

        <td
          mat-cell
          *matCellDef="let task"
        >

          <button
            mat-button
            color="primary"
            type="button"
            (click)="toggleTask(task)"
          >
            {{ task.completed ? 'Undo' : 'Complete' }}
          </button>

          <button
            mat-button
            color="warn"
            type="button"
            (click)="deleteTask(task.id)"
          >
            Delete
          </button>

        </td>

      </ng-container>


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        "
      ></tr>

    </table>

  </mat-card-content>

</mat-card>

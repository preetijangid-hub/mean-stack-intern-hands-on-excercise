<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzBuzz Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>FizzBuzz Checker</h1>

        <p>Enter a number to check whether it is Fizz, Buzz or FizzBuzz.</p>

        <input
            type="number"
            id="numberInput"
            placeholder="Enter a number">

        <div class="buttons">
            <button onclick="checkFizzBuzz()">Check</button>
            <button onclick="resetForm()">Reset</button>
        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
